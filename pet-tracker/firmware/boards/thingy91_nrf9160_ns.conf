#
# Thingy:91 (nRF9160 + ADXL362): reference hardware for the motion logic.
#
# ADXL362 in linked + referenced mode with autosleep: one interrupt when
# motion starts, one after 5 min of stillness; ~270 nA while asleep.
#   ODR 12.5 Hz, +-2 g (1 mg/LSB)
#   activity:   >80 mg for 5 samples (~400 ms)
#   inactivity: <60 mg for 3750 samples (5 min)
#
# Tuned for cats: a stalking cat moves gently, so the activity threshold is
# low (dog trackers use ~150 mg); 400 ms filters single twitches in sleep.
# Missing a walk is worse than an extra fix after grooming; and a resting
# collar re-checks its position every 8 h (TRACKER_STILL_VERIFY_S) in case
# movement slips through. Tune both on real cats with the debug overlay.
#
CONFIG_SENSOR=y
CONFIG_ADXL362=y
CONFIG_ADXL362_TRIGGER_GLOBAL_THREAD=y
CONFIG_ADXL362_ACCEL_RANGE_2G=y
CONFIG_ADXL362_ACCEL_ODR_12_5=y
CONFIG_ADXL362_INTERRUPT_MODE=1
CONFIG_ADXL362_ABS_REF_MODE=1
CONFIG_ADXL362_ACTIVITY_THRESHOLD=80
CONFIG_ADXL362_ACTIVITY_TIME=5
CONFIG_ADXL362_INACTIVITY_THRESHOLD=60
CONFIG_ADXL362_INACTIVITY_TIME=3750
