[/Script/Engine.RendererSettings]
; Lumen GI + reflections, Virtual Shadow Maps, Nanite, TSR
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Runtime Virtual Texturing: the terrain blends into the roadside through RVT_RoadBlend
r.VirtualTextures=True
; Skinned rider in Lumen/ray-traced reflections
r.SkinCache.CompileShaders=True

[/Script/Engine.PhysicsSettings]
; Surface types for the PhysMats the import creates (PM_Asphalt 0.8 … PM_Gravel 0.4)
+PhysicalSurfaces=(Type=SurfaceType1,Name="Asphalt")
+PhysicalSurfaces=(Type=SurfaceType2,Name="Setts")
+PhysicalSurfaces=(Type=SurfaceType3,Name="Gravel")
+PhysicalSurfaces=(Type=SurfaceType4,Name="Grass")
+PhysicalSurfaces=(Type=SurfaceType5,Name="Soil")
+PhysicalSurfaces=(Type=SurfaceType6,Name="Water")
+PhysicalSurfaces=(Type=SurfaceType7,Name="Metal")

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DirectX 12 with Shader Model 6: required by Nanite and Virtual Shadow Maps
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
