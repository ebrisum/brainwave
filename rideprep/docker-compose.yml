# RidePrep backend: `docker compose up`, then `pnpm dev` for the web client (http://localhost:5173).
name: rideprep

x-builder-env: &builder-env
  RIDEPREP_COURSES_DIR: /data/courses
  GPX2COURSE_CACHE: /data/cache
  REDIS_URL: redis://redis:6379/0
  VALHALLA_URL: http://valhalla:8002
  OSM_PBF_DIR: /data/osm
  STORAGE: ${RIDEPREP_STORAGE:-local}     # set to "minio" to serve packages via signed MinIO URLs
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-rideprep}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-rideprep-secret}
  GPX2COURSE_WORKERS: ${GPX2COURSE_WORKERS:-16}

services:
  api:
    build: { context: services/course-builder, target: api }
    environment: *builder-env
    ports: ["8000:8000"]
    volumes: [courses:/data/courses, cache:/data/cache]
    depends_on: [redis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s

  worker:
    build: { context: services/course-builder, target: worker }
    environment: *builder-env
    volumes: [courses:/data/courses, cache:/data/cache, ./data/osm:/data/osm:ro]
    depends_on: [redis, valhalla]
    deploy: { replicas: 1 }

  redis:
    image: redis:7-alpine
    volumes: [redis:/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rideprep}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rideprep-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  valhalla:
    # Builds routing tiles from the extract(s) on first start (can take a while for large regions).
    image: ghcr.io/valhalla/valhalla-scripted:latest   # pin to a digest in production (docs/DECISIONS.md)
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-https://download.geofabrik.de/europe/netherlands-latest.osm.pbf}
      use_tiles_ignore_pbf: "True"
      server_threads: "4"
    ports: ["8002:8002"]
    volumes: [valhalla:/custom_files]

volumes:
  courses: {}
  cache: {}
  redis: {}
  minio: {}
  valhalla: {}
