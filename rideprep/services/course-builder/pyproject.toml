[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpx2course"
version = "2026.10.0"
description = "Turn any GPX/TCX/FIT course into a rideable RidePrep course package"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4,<3",
  "scipy>=1.17,<2",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
  "rasterio>=1.4,<2",
  "pyarrow>=25,<26",
  "fitdecode>=0.11,<1",
  "httpx>=0.28,<1",
  "pillow>=11",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
api = ["fastapi>=0.142,<1", "uvicorn>=0.37", "python-multipart>=0.0.20", "redis>=6", "rq>=2", "minio>=7.2"]
dev = ["pytest>=9.1"]

[project.scripts]
gpx2course = "gpx2course.cli:main"

[tool.setuptools.packages.find]
include = ["gpx2course*", "api*"]

[tool.setuptools.package-data]
gpx2course = ["schema/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to public data endpoints", "slow: long-running"]
